plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

import net.fabricmc.loom.task.RemapJarTask

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def serverRootDir = file("${projectDir}/../..").canonicalFile
def polymerSourceAssetsDir = file("${serverRootDir}/polymer/source_assets")
def rendererBotTemplateDir = file("${serverRootDir}/run-renderer-bot")
def rendererBotRunDir = file("${buildDir}/dev-runtime/renderer-bot").canonicalFile
def skinRestorerJars = fileTree(dir: "${serverRootDir}/mods", include: "skinrestorer-*.jar")
def tabJars = fileTree(dir: "${serverRootDir}/mods", include: "TAB*.jar")
def webcamJars = fileTree(dir: "${serverRootDir}/mods", include: "webcam-fabric-*.jar")
def skinRestorerNestedLibDir = file("${buildDir}/skinrestorer-libs")
def skinRestorerJavaClientJars = fileTree(dir: skinRestorerNestedLibDir, include: "java-client-*.jar")
def voicechatApiDevDir = file("${buildDir}/dev-runtime/voicechat-api")
def voicechatApiDevJar = file("${voicechatApiDevDir}/voicechat-api-2.6.20.jar")
def isServerDevRun = gradle.startParameter.taskNames.any { it == "runServer" || it.endsWith(":runServer") }
def voicechatRuntimeArtifact = configurations.create("voicechatRuntimeArtifact") {
	canBeConsumed = false
	canBeResolved = true
}
def rendererBotNameProp = providers.systemProperty("lg2.rendererBotName").orElse("RendererBot")
def rendererBotServerProp = providers.systemProperty("lg2.rendererBotServer").orElse("127.0.0.1:25565")
def cameraMediaCacheRoot = file("${serverRootDir}/cache/lg2-camera").canonicalFile
// Keep the normal development profile explicit, while letting the VPS service
// set a bounded heap for the server and the renderer bot independently.
def serverXmsProp = providers.systemProperty("lg2.serverXms").orElse("1G")
def serverXmxProp = providers.systemProperty("lg2.serverXmx").orElse("4G")
def rendererBotXmsProp = providers.systemProperty("lg2.rendererBotXms").orElse("4G")
def rendererBotXmxProp = providers.systemProperty("lg2.rendererBotXmx").orElse("4G")
// GLFW's GLX path is not available in every otherwise-valid Xwayland/Xorg
// session. Keep this an explicit launcher argument so the renderer bot can
// consistently select its EGL context path when requested by the server.
def rendererBotHeadlessProp = providers.systemProperty("lg2.rendererBotHeadless").orElse("false")

repositories {
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}
	maven {
		name = "Ladysnake Releases"
		url = "https://maven.ladysnake.org/releases"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"lg2" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		named("server") {
			runDir("../../")
			vmArgs(
					"-Xms${serverXmsProp.get()}",
					"-Xmx${serverXmxProp.get()}",
					"-Djava.net.preferIPv4Stack=true"
			)
		}

		rendererBotClient {
			inherit client
			configName = "Renderer Bot Client"
			ideConfigGenerated = true
			runDir(rendererBotRunDir.absolutePath)
			vmArgs(
					"-Xms${rendererBotXmsProp.get()}",
					"-Xmx${rendererBotXmxProp.get()}",
				"-Dlg2.rendererBot=true",
				"-Dlg2.rendererBotName=${rendererBotNameProp.get()}",
				"-Dlg2.rendererBotServer=${rendererBotServerProp.get()}",
				"-Dlg2.rendererBotHeadless=${rendererBotHeadlessProp.get()}",
				"-Dlg2.cameraMediaCacheRoot=${cameraMediaCacheRoot.absolutePath}"
			)
			programArg("--offlineDeveloperMode")
			programArg("--username=${rendererBotNameProp.get()}")
			programArg("--width=960")
			programArg("--height=540")
			client()
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	modImplementation "eu.pb4:polymer-core:${project.polymer_version}"
	modImplementation "eu.pb4:polymer-blocks:${project.polymer_version}"
	modImplementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
	modImplementation files(skinRestorerJars)
	compileOnly files(tabJars)
	// Pin the same stable SVC release used by production. Do not compile or run
	// clients against the stale top-level mods/ copy; that was the source of a
	// silent 2.6.12 vs 2.6.22 split between development/client and production.
	add(voicechatRuntimeArtifact.name, "maven.modrinth:9eGKb6K1:CN53keBo")
	modCompileOnly "maven.modrinth:9eGKb6K1:CN53keBo"
	modRuntimeOnly "maven.modrinth:9eGKb6K1:CN53keBo"
	// Loom strips nested-mod declarations while remapping dependencies for a
	// development run. vcinteraction needs SVC's nested voicechat_api as a
	// first-class runtime mod, so expose the extracted API JAR to Loom as well.
	if (isServerDevRun) {
		modRuntimeOnly files(voicechatApiDevJar)
	}
	modCompileOnly files(webcamJars)
	modRuntimeOnly files(webcamJars)
	modCompileOnly files("${serverRootDir}/mods/fsit-2.8.3+mc1.21.11.jar")
	implementation files(
			"libs/flow-math-1.0.3.jar",
			"libs/bluenbt-3.5.0.jar"
	)
	runtimeOnly files(skinRestorerJavaClientJars)
	modRuntimeOnly files("${serverRootDir}/mods/cardinal-components-api-${project.cardinal_components_version}.jar")
}

// Loom validates runtime mod files while Gradle configures the launch, before
// any task can run. Materialize the nested API at that point, but only for a
// local server launch; it remains a disposable build/ artifact.
if (isServerDevRun && !voicechatApiDevJar.isFile()) {
	copy {
		from({ voicechatRuntimeArtifact.files.collect { zipTree(it) } })
		include("META-INF/jars/voicechat-api-2.6.20.jar")
		eachFile { it.path = it.name }
		includeEmptyDirs = false
		into(voicechatApiDevDir)
	}
}

tasks.register("prepareRendererBotClientRunDir", Copy) {
	onlyIf { rendererBotTemplateDir.isDirectory() }
	from(rendererBotTemplateDir) {
		exclude(
				".fabric/**",
				"logs/**",
				"debug/**",
				"crash-reports/**",
				"downloads/**",
				"polymer/resource_pack.zip",
				"options.txt",
				"servers.dat",
				"servers.dat_old",
				"data/fabric_default_resource_packs.json",
				"config/voicechat/category-volumes.properties",
				"config/voicechat/player-volumes.properties",
				"config/voicechat/username-cache.json",
				"config/webcam/blocked_sources.json"
		)
	}
	into(rendererBotRunDir)
	includeEmptyDirs = true
}

tasks.register("extractSkinRestorerNestedLibraries", Copy) {
	from({
		skinRestorerJars.files.collect { zipTree(it) }
	})
	include("META-INF/jars/java-client-*.jar")
	eachFile { it.path = it.name }
	includeEmptyDirs = false
	into(skinRestorerNestedLibDir)
}

tasks.register("prepareDevResourcePack", Sync) {
	from(layout.projectDirectory.dir("resourcepack"))
	from(layout.projectDirectory.dir("src/main/resources/assets")) {
		into("assets")
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	into(polymerSourceAssetsDir)
	includeEmptyDirs = true
}

tasks.matching { it.name == "runServer" }.configureEach {
	dependsOn(tasks.named("prepareDevResourcePack"))
	dependsOn(tasks.named("extractSkinRestorerNestedLibraries"))
}

tasks.matching { it.name == "runRendererBotClient" }.configureEach {
	dependsOn(tasks.named("extractSkinRestorerNestedLibraries"))
	dependsOn(tasks.named("prepareRendererBotClientRunDir"))
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named("test", Test) {
	failOnNoDiscoveredTests = false
	dependsOn(tasks.named("extractSkinRestorerNestedLibraries"))
}

tasks.withType(JavaExec).configureEach {
	dependsOn(tasks.named("extractSkinRestorerNestedLibraries"))
}

