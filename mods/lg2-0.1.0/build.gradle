	dependsOn(tasks.named("runDailyMaintenanceTest"))
	dependsOn(tasks.named("runYandexMapRenderPhaseEightTest"))
	dependsOn(tasks.named("runYandexMapRenderPhaseSevenTest"))
	dependsOn(tasks.named("runYandexMapRenderPhaseSixTest"))
	dependsOn(tasks.named("runYandexMapRenderVerticalSliceTest"))
	dependsOn(tasks.named("runYandexMapRenderPhaseFourTest"))
	dependsOn(tasks.named("runYandexMapRenderPhaseThreeTest"))
	dependsOn(tasks.named("runYandexMapRenderPhaseTwoTest"))
	dependsOn(tasks.named("runYandexMapRenderPhaseOneTest"))
	dependsOn(tasks.named("runGennadiyReportTrackerTest"))
	dependsOn(tasks.named("runCompanionMovementTest"))
	dependsOn(tasks.named("runRaceFixRegressionTest"))
	dependsOn(tasks.named("runAncientUkrCreditorSelectionTest"))
