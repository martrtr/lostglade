	group = "verification"
	description = "Checks moving virtual-light updates, cleanup, overlap and concurrent batching."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.OrthodoxLightSyncTest"
	dependsOn(tasks.named("testClasses"))
}

