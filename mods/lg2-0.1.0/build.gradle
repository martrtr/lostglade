plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

import net.fabricmc.loom.task.RemapJarTask

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def serverRootDir = file("${projectDir}/../..").canonicalFile
def polymerSourceAssetsDir = file("${serverRootDir}/polymer/source_assets")
def rendererBotTemplateDir = file("${serverRootDir}/run-renderer-bot")
def rendererBotRunDir = file("${buildDir}/dev-runtime/renderer-bot").canonicalFile
def skinRestorerJars = fileTree(dir: "${serverRootDir}/mods", include: "skinrestorer-*.jar")
def tabJars = fileTree(dir: "${serverRootDir}/mods", include: "TAB*.jar")
def voicechatJars = fileTree(dir: "${serverRootDir}/mods", include: "voicechat-fabric-*.jar")
def webcamJars = fileTree(dir: "${serverRootDir}/mods", include: "webcam-fabric-*.jar")
def skinRestorerNestedLibDir = file("${buildDir}/skinrestorer-libs")
def skinRestorerJavaClientJars = fileTree(dir: skinRestorerNestedLibDir, include: "java-client-*.jar")
def rendererBotNameProp = providers.systemProperty("lg2.rendererBotName").orElse("RendererBot")
def rendererBotServerProp = providers.systemProperty("lg2.rendererBotServer").orElse("127.0.0.1:25565")
def cameraMediaCacheRoot = file("${serverRootDir}/cache/lg2-camera").canonicalFile
// Keep the normal development profile explicit, while letting the VPS service
// set a bounded heap for the server and the renderer bot independently.
def serverXmsProp = providers.systemProperty("lg2.serverXms").orElse("8G")
def serverXmxProp = providers.systemProperty("lg2.serverXmx").orElse("8G")
def rendererBotXmsProp = providers.systemProperty("lg2.rendererBotXms").orElse("4G")
def rendererBotXmxProp = providers.systemProperty("lg2.rendererBotXmx").orElse("4G")

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}
	maven {
		name = "Ladysnake Releases"
		url = "https://maven.ladysnake.org/releases"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"lg2" {
			sourceSet sourceSets.main
			// The renderer bot is a client run of this same mod.  Its capture
			// pipeline loads shaders from src/client/resources, so those resources
			// must be present on the development client classpath as well.
			sourceSet sourceSets.client
		}
	}

	runs {
		named("server") {
			runDir("../../")
			vmArgs("-Xms${serverXmsProp.get()}", "-Xmx${serverXmxProp.get()}")
		}

		rendererBotClient {
			inherit client
			configName = "Renderer Bot Client"
			ideConfigGenerated = true
			runDir(rendererBotRunDir.absolutePath)
			vmArgs(
					"-Xms${rendererBotXmsProp.get()}",
					"-Xmx${rendererBotXmxProp.get()}",
					"-Dlg2.rendererBot=true",
					"-Dlg2.rendererBotName=${rendererBotNameProp.get()}",
					"-Dlg2.rendererBotServer=${rendererBotServerProp.get()}",
					"-Dlg2.cameraMediaCacheRoot=${cameraMediaCacheRoot.absolutePath}"
			)
			programArg("--offlineDeveloperMode")
			programArg("--username=${rendererBotNameProp.get()}")
			programArg("--width=960")
			programArg("--height=540")
			client()
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "eu.pb4:polymer-core:${project.polymer_version}"
	modImplementation "eu.pb4:polymer-blocks:${project.polymer_version}"
	modImplementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
	modImplementation files(skinRestorerJars)
	compileOnly files(tabJars)
	modCompileOnly files(voicechatJars)
	modCompileOnly files(webcamJars)
	modRuntimeOnly files(voicechatJars)
	modRuntimeOnly files(webcamJars)
	implementation files(
			"libs/flow-math-1.0.3.jar",
			"libs/bluenbt-3.5.0.jar"
	)
	runtimeOnly files(skinRestorerJavaClientJars)
	modRuntimeOnly files("${serverRootDir}/mods/cardinal-components-api-${project.cardinal_components_version}.jar")
	
}

tasks.register("prepareRendererBotClientRunDir", Copy) {
	onlyIf { rendererBotTemplateDir.isDirectory() }
	from(rendererBotTemplateDir) {
		exclude(
				".fabric/**",
				"logs/**",
				"debug/**",
				"crash-reports/**",
				"downloads/**",
				"polymer/resource_pack.zip",
				"options.txt",
				"servers.dat",
				"servers.dat_old",
				"data/fabric_default_resource_packs.json",
				"config/voicechat/category-volumes.properties",
				"config/voicechat/player-volumes.properties",
				"config/voicechat/username-cache.json",
				"config/webcam/blocked_sources.json"
		)
	}
	into(rendererBotRunDir)
	includeEmptyDirs = true
}

tasks.register("extractSkinRestorerNestedLibraries", Copy) {
	from({
		skinRestorerJars.files.collect { zipTree(it) }
	})
	include("META-INF/jars/java-client-*.jar")
	eachFile { it.path = it.name }
	includeEmptyDirs = false
	into(skinRestorerNestedLibDir)
}

tasks.register("prepareDevResourcePack", Sync) {
	from(layout.projectDirectory.dir("resourcepack"))
	from(layout.projectDirectory.dir("src/main/resources/assets")) {
		into("assets")
	}
	// Resource-pack overrides (e.g. lang keys for pack users) must win over base assets.
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	into(polymerSourceAssetsDir)
	includeEmptyDirs = true
}

tasks.matching { it.name == "runServer" }.configureEach {
	dependsOn(tasks.named("prepareDevResourcePack"))
	dependsOn(tasks.named("extractSkinRestorerNestedLibraries"))
}

tasks.matching { it.name == "runRendererBotClient" }.configureEach {
	dependsOn(tasks.named("extractSkinRestorerNestedLibraries"))
	dependsOn(tasks.named("prepareRendererBotClientRunDir"))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named("test", Test) {
	failOnNoDiscoveredTests = false
}

tasks.register("runOrthodoxLightSyncTest", JavaExec) {
	group = "verification"
	description = "Checks moving virtual-light updates, cleanup, overlap and concurrent batching."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.OrthodoxLightSyncTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runAncientUkrCreditorSelectionTest", JavaExec) {
	group = "verification"
	description = "Checks creditor AI actions, amount validation and repayment lifecycle."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.AncientUkrCreditorSelectionTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runAncientUkrCollectorRulesTest", JavaExec) {
	group = "verification"
	description = "Checks collector debt threshold and wave sizing rules."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.AncientUkrCollectorRulesTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runOrthodoxWingRigTest", JavaExec) {
	group = "verification"
	description = "Checks defense wing assets, articulated poses and flight transitions."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.OrthodoxWingRigTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runOrthodoxEyeCompositionTest", JavaExec) {
	group = "verification"
	description = "Checks divine eye assets, ray roots, animation and wing attachments."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.OrthodoxEyeCompositionTest"
	args "--preview"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runDronePhysicsSimulationTest", JavaExec) {
	group = "verification"
	description = "Runs the standalone drone physics simulation checks."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.DronePhysicsSimulationTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runMonitorMediaStateMachineTest", JavaExec) {
	group = "verification"
	description = "Runs monitor media session, queue, and stale-load regression checks."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.MonitorMediaStateMachineTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runYandexMapTopDownRenderTest", JavaExec) {
	group = "verification"
	description = "Runs Yandex map top-down block rendering regression checks."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.YandexMapTopDownRenderTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runDroneScreenLinkPolicyTest", JavaExec) {
	group = "verification"
	description = "Runs powered screen-link and unloaded drone control regression checks."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.DroneScreenLinkPolicyTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runMonitorScreenTouchProjectionTest", JavaExec) {
	group = "verification"
	description = "Runs monitor screen touch ray-to-plane projection regression checks."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.MonitorScreenTouchProjectionTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.register("runMicrophoneSpeakerCapturePolicyTest", JavaExec) {
	group = "verification"
	description = "Runs microphone speaker capture and feedback-protection checks."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.lostglade.server.MicrophoneSpeakerCapturePolicyTest"
	dependsOn(tasks.named("testClasses"))
}

tasks.named("check") {
	dependsOn(tasks.named("runAncientUkrCreditorSelectionTest"))
	dependsOn(tasks.named("runAncientUkrCollectorRulesTest"))
	dependsOn(tasks.named("runOrthodoxLightSyncTest"))
	dependsOn(tasks.named("runOrthodoxWingRigTest"))
	dependsOn(tasks.named("runOrthodoxEyeCompositionTest"))
	dependsOn(tasks.named("runDronePhysicsSimulationTest"))
	dependsOn(tasks.named("runMonitorMediaStateMachineTest"))
	dependsOn(tasks.named("runYandexMapTopDownRenderTest"))
	dependsOn(tasks.named("runDroneScreenLinkPolicyTest"))
	dependsOn(tasks.named("runMonitorScreenTouchProjectionTest"))
	dependsOn(tasks.named("runMicrophoneSpeakerCapturePolicyTest"))
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	// The distributable lg2 jar is server-only. Client features are emitted by
	// gameplayClientDevJar/remapGameplayClientJar below.
	exclude(
			"com/lostglade/Lg2Client.class",
			"com/lostglade/client/**",
			"com/lostglade/mixin/client/**",
			"com/lostglade/raceclient/**",
			"lg2.client.mixins.json",
			"lg2.absolute_invisibility.client.mixins.json",
			"assets/lg2/textures/gui/race/**",
			"race-client/**"
	)
}

// Normal players receive one self-contained client companion: race UI, drone
// tilt, and the GPU camera renderer. The regular lg2 jar stays server-only.
def gameplayClientDevJar = tasks.register("gameplayClientDevJar", Jar) {
	group = "build"
	description = "Assembles the complete Lostglade client jar before remapping."
	dependsOn(tasks.named("classes"))
	archiveBaseName.set("lg2-client")
	archiveVersion.set(project.version.toString())
	archiveClassifier.set("dev")
	destinationDirectory.set(layout.buildDirectory.dir("devlibs"))
	// The GPU capture implementation shares protocol, cache and palette classes
	// with the server module. Include the compiled project output, but expose it
	// through a client-only fabric.mod.json below, so it never becomes a server
	// entrypoint when installed in Prism.
	from(sourceSets.main.output) {
		// Server datapacks reference blocks/features that a client companion never
		// registers. Shipping them makes unrelated singleplayer worlds fail to load.
		exclude("fabric.mod.json", "data/**")
	}
	from(sourceSets.client.output)
	from("src/client/resources/race-client") {
		exclude("fabric.mod.json")
	}
	from("src/client/resources/race-client") {
		include("fabric.mod.json")
		expand(version: project.version)
	}
}

tasks.register("remapGameplayClientJar", RemapJarTask) {
	group = "build"
	description = "Remaps the lightweight Lostglade client jar for Prism/Fabric."
	dependsOn(gameplayClientDevJar)
	inputFile.set(gameplayClientDevJar.flatMap { it.archiveFile })
	archiveBaseName.set("lg2-client")
	archiveVersion.set(project.version.toString())
	destinationDirectory.set(layout.buildDirectory.dir("libs"))
	addNestedDependencies.set(false)
}

tasks.register("installGameplayClientJar", Sync) {
	group = "build"
	description = "Publishes the lightweight client jar into the repository's client-mods directory."
	dependsOn(tasks.named("remapGameplayClientJar"))
	from(tasks.named("remapGameplayClientJar").flatMap { it.archiveFile })
	into(layout.projectDirectory.dir("client-mods"))
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
