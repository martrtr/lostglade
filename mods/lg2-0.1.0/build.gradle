	dependsOn(tasks.named("runOrthodoxLightSyncTest"))
	dependsOn(tasks.named("runOrthodoxWingRigTest"))
	dependsOn(tasks.named("runOrthodoxEyeCompositionTest"))
	dependsOn(tasks.named("runDronePhysicsSimulationTest"))
	dependsOn(tasks.named("runMonitorMediaStateMachineTest"))
	dependsOn(tasks.named("runDroneScreenLinkPolicyTest"))
	dependsOn(tasks.named("runMonitorScreenTouchProjectionTest"))
	dependsOn(tasks.named("runMicrophoneSpeakerCapturePolicyTest"))
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
	exclude(
			"com/lostglade/Lg2Client.class",
			"com/lostglade/client/**",
			"com/lostglade/mixin/client/**",
			"com/lostglade/raceclient/**",
			"lg2.client.mixins.json",
			"lg2.absolute_invisibility.client.mixins.json",
			"assets/lg2/textures/gui/race/**",
			"race-client/**"
	)
}

def gameplayClientDevJar = tasks.register("gameplayClientDevJar", Jar) {
	group = "build"
	description = "Assembles the complete Lostglade client jar before remapping."
	dependsOn(tasks.named("classes"))
	archiveBaseName.set("lg2-client")
	archiveVersion.set(project.version.toString())
	archiveClassifier.set("dev")
	destinationDirectory.set(layout.buildDirectory.dir("devlibs"))
	from(sourceSets.main.output) {
		exclude("fabric.mod.json", "data/**")
	}
	from(sourceSets.client.output)
	from("src/client/resources/race-client") {
		exclude("fabric.mod.json")
	}
	from("src/client/resources/race-client") {
		include("fabric.mod.json")
		expand(version: project.version)
	}
}

tasks.register("remapGameplayClientJar", RemapJarTask) {
	group = "build"
	description = "Remaps the lightweight Lostglade client jar for Prism/Fabric."
	dependsOn(gameplayClientDevJar)
	inputFile.set(gameplayClientDevJar.flatMap { it.archiveFile })
	archiveBaseName.set("lg2-client")
	archiveVersion.set(project.version.toString())
	destinationDirectory.set(layout.buildDirectory.dir("libs"))
	addNestedDependencies.set(false)
}

tasks.register("installGameplayClientJar", Sync) {
	group = "build"
	description = "Publishes the lightweight client jar into the repository's client-mods directory."
	dependsOn(tasks.named("remapGameplayClientJar"))
	from(tasks.named("remapGameplayClientJar").flatMap { it.archiveFile })
	into(layout.projectDirectory.dir("client-mods"))
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}
